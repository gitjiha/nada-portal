<!DOCTYPE html>
<html>
<head>
    <title>NADA Pahang Portal</title>
    <style>
        body { margin: 0; display: flex; height: 100vh; font-family: 'Segoe UI', sans-serif; }
        
        /* Dashboard area */
        #pbi-container { flex-grow: 1; border: none; }

        /* The Slide-out Drawer */
        #ai-drawer {
            position: fixed; top: 0; right: -400px; /* Hidden */
            width: 400px; height: 100%;
            background: white; box-shadow: -2px 0 10px rgba(0,0,0,0.2);
            transition: 0.3s; z-index: 100;
        }
        #ai-drawer.open { right: 0; }

        /* Floating Trigger Button */
        #trigger {
            position: fixed; bottom: 20px; right: 20px;
            background: #004a99; color: white; border: none;
            padding: 15px 25px; border-radius: 30px; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 101;
        }
    </style>
</head>
<body>

    <!-- Your Power BI Dashboard -->
    <iframe id="pbi-container" width="100%" src="https://app.powerbi.com/view?r=eyJrIjoiMTBhMGQ5MjMtY2QwMC00NDkwLTg1N2UtNDY5YmVjNDVhYTkxIiwidCI6IjE4Y2U3NmY2LTk5ZjQtNDU3Zi05ZjYyLWFjZDY1ZDliOTc3NyIsImMiOjEwfQ%3D%3D"></iframe>

    <button id="trigger" onclick="toggle()">✨ Ask NADA Assistant</button>

    <div id="ai-drawer">
        <div style="padding:10px; background:#eee; display:flex; justify-content:space-between;">
            <strong>NADA AI</strong>
            <button onclick="toggle()">X</button>
        </div>
        <!-- Your Streamlit App URL -->
        <iframe src="https://nada-project-mvddmgmsxw3qhf9kgc2eoy.streamlit.app/?embed=true" width="100%" height="90%" frameborder="0"></iframe>
    </div>

    <script>
        function toggle() {
            document.getElementById('ai-drawer').classList.toggle('open');
        }
    </script>
</body>
</html>
